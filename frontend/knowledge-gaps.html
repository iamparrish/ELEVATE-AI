<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Gaps — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .gap-card { padding: 20px; margin-bottom: 16px; }
  .trend-up { color: var(--color-success); } .trend-down { color: var(--color-danger); } .trend-flat { color: var(--color-text-muted); }
  .mistake-tag { display: inline-block; background: var(--color-danger-light); color: var(--color-danger); padding: 4px 10px; border-radius: 999px; font-size: 12px; margin: 3px 6px 3px 0; }
  .action-item { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-root"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="app-main">
    <header class="app-topbar" id="topbar-root"></header>
    <div class="app-content" id="page-content">
      <h2>Knowledge Gaps</h2>
      <p class="text-muted">Topics where your recent performance suggests extra attention is needed.</p>
      <div class="skeleton" style="height:200px;margin-top:16px"></div>
    </div>
  </main>
</div>
<nav class="bottom-nav" id="bottom-nav-root"></nav>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireRole('student');
initShell('knowledge-gaps');
</script>
<script src="js/knowledgeGaps.js"></script>
</body>
</html>
