<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Learning Path — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .path-track { position: relative; padding-left: 28px; }
  .path-track::before { content: ''; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--color-border); }
  .path-node { position: relative; margin-bottom: 16px; }
  .path-node::before { content: ''; position: absolute; left: -28px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--color-border-strong); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--color-border-strong); }
  .path-node.mastered::before, .path-node.completed::before { background: var(--color-success); box-shadow: 0 0 0 2px var(--color-success); }
  .path-node.needs_revision::before { background: var(--color-warning); box-shadow: 0 0 0 2px var(--color-warning); }
  .path-node.in_progress::before, .path-node.developing::before { background: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary); }
  .path-card { padding: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-root"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="app-main">
    <header class="app-topbar" id="topbar-root"></header>
    <div class="app-content" id="page-content">
      <h2>My Learning Path</h2>
      <p class="text-muted">A dynamic roadmap that adapts to your actual performance.</p>
      <div class="skeleton" style="height:300px;margin-top:20px"></div>
    </div>
  </main>
</div>
<nav class="bottom-nav" id="bottom-nav-root"></nav>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireRole('student');
initShell('learning-path');
</script>
<script src="js/learningPath.js"></script>
</body>
</html>
