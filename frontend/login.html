<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 420px; }
  .auth-brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: 28px; font-weight:800; font-size: 20px; }
  .demo-box { background: var(--color-primary-light); border-radius: var(--radius-sm); padding: 14px; margin-top: 18px; font-size: 13px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-brand"><span class="brand-mark">E</span> ELEVATE AI</a>
    <div class="card card-pad">
      <h2 style="text-align:center">Welcome back</h2>
      <p style="text-align:center;margin-bottom:24px">Log in to continue your personalized learning journey.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" required placeholder="••••••••">
        </div>
        <div id="login-error" class="error-text hidden"></div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Log In</button>
      </form>
      <div class="demo-box">
        <strong>Demo accounts</strong><br>
        Student: aarav.sharma@example.com / password123<br>
        Teacher: priya.mehta@example.com / password123
      </div>
    </div>
    <p style="text-align:center;margin-top:18px">Don't have an account? <a href="signup.html" style="color:var(--color-primary);font-weight:700">Sign up</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
redirectIfLoggedIn();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Logging in...';
  try {
    const data = await Api.post('/api/auth/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    Auth.setSession(data.token, data.user);
    if (data.user.role === 'teacher') location.href = 'teacher-dashboard.html';
    else if (!data.user.onboarding_completed) location.href = 'onboarding.html';
    else location.href = 'dashboard.html';
  } catch (err) {
    errEl.textContent = err.message || 'Login failed';
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
