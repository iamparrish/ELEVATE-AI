<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Results — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-root"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="app-main">
    <header class="app-topbar" id="topbar-root"></header>
    <div class="app-content" id="page-content" style="max-width:760px;margin:0 auto"></div>
  </main>
</div>
<nav class="bottom-nav" id="bottom-nav-root"></nav>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireRole('student');
initShell('assessments');

const raw = sessionStorage.getItem('elevate_last_result');
const content = document.getElementById('page-content');
if (!raw) {
  content.innerHTML = `<div class="empty-state">${Icons.empty}<h4>No recent result to show</h4><a href="assessments.html" class="btn btn-primary">Go to Assessments</a></div>`;
} else {
  const r = JSON.parse(raw);
  const scoreColor = r.score >= 70 ? 'var(--color-success)' : r.score >= 45 ? 'var(--color-warning)' : 'var(--color-danger)';
  content.innerHTML = `
    <div class="card result-hero">
      <div class="result-score" style="color:${scoreColor}">${r.score}%</div>
      <p class="text-muted">${r.correct_count} of ${r.total_questions} correct · ${r.title}</p>
    </div>
    <div class="two-col" style="margin-top:20px">
      <div class="card card-pad">
        <h3 style="color:var(--color-success)">Strong Concepts</h3>
        ${r.strengths && r.strengths.length ? r.strengths.map(s => `<div class="topic-result-row"><span>${s.topic}</span><span class="badge badge-success">${s.mastery}% (${s.change >= 0 ? '+' : ''}${s.change})</span></div>`).join('') : `<p class="text-muted text-sm">No strong concepts identified yet.</p>`}
      </div>
      <div class="card card-pad">
        <h3 style="color:var(--color-warning)">Needs Attention</h3>
        ${r.weaknesses && r.weaknesses.length ? r.weaknesses.map(s => `<div class="topic-result-row"><span>${s.topic}</span><span class="badge badge-warning">${s.mastery}% (${s.change >= 0 ? '+' : ''}${s.change})</span></div>`).join('') : `<p class="text-muted text-sm">Nothing flagged - nice work.</p>`}
      </div>
    </div>
    <div class="card card-pad" style="margin-top:20px">
      <h3>Recommended Next Actions</h3>
      <p class="text-sm">Based on this result, ELEVATE AI has updated your Knowledge Gaps and Learning Path automatically.</p>
      <div class="flex gap-12" style="margin-top:10px">
        <a href="knowledge-gaps.html" class="btn btn-primary btn-sm">View Knowledge Gaps</a>
        <a href="learning-path.html" class="btn btn-secondary btn-sm">View Learning Path</a>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
