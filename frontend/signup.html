<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .auth-card { width: 100%; max-width: 460px; }
  .auth-brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: 28px; font-weight:800; font-size: 20px; }
  .role-select { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .role-option { border: 1.5px solid var(--color-border-strong); border-radius: var(--radius-sm); padding: 14px; text-align: center; cursor: pointer; font-weight: 700; font-size: 14px; }
  .role-option.selected { border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-brand"><span class="brand-mark">E</span> ELEVATE AI</a>
    <div class="card card-pad">
      <h2 style="text-align:center">Create your account</h2>
      <p style="text-align:center;margin-bottom:20px">Start your personalized learning journey today.</p>
      <form id="signup-form">
        <div class="role-select">
          <div class="role-option selected" data-role="student">I'm a Student</div>
          <div class="role-option" data-role="teacher">I'm a Teacher</div>
        </div>
        <div class="field"><label for="full_name">Full Name</label><input class="input" id="full_name" required placeholder="Aarav Sharma"></div>
        <div class="field"><label for="email">Email</label><input class="input" type="email" id="email" required placeholder="you@example.com"></div>
        <div class="grid-2">
          <div class="field"><label for="password">Password</label><input class="input" type="password" id="password" required minlength="6"></div>
          <div class="field"><label for="confirm_password">Confirm Password</label><input class="input" type="password" id="confirm_password" required minlength="6"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="academic_level">Academic Level</label>
            <select class="input" id="academic_level">
              <option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option>
              <option>Grade 11</option><option>Grade 12</option><option>Undergraduate</option><option>Faculty</option>
            </select>
          </div>
          <div class="field"><label for="institution">Institution</label><input class="input" id="institution" placeholder="Your school"></div>
        </div>
        <div id="signup-error" class="error-text hidden"></div>
        <button class="btn btn-primary btn-block" type="submit" id="signup-btn">Create Account</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:18px">Already have an account? <a href="login.html" style="color:var(--color-primary);font-weight:700">Log in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
redirectIfLoggedIn();
let selectedRole = 'student';
document.querySelectorAll('.role-option').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedRole = el.dataset.role;
  });
});

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signup-btn');
  const errEl = document.getElementById('signup-error');
  errEl.classList.add('hidden');

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match'; errEl.classList.remove('hidden'); return;
  }

  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const data = await Api.post('/api/auth/register', {
      full_name: document.getElementById('full_name').value.trim(),
      email: document.getElementById('email').value.trim(),
      password, confirm_password: confirm,
      academic_level: document.getElementById('academic_level').value,
      institution: document.getElementById('institution').value.trim(),
      role: selectedRole,
    });
    Auth.setSession(data.token, data.user);
    if (selectedRole === 'teacher') location.href = 'teacher-dashboard.html';
    else location.href = 'onboarding.html';
  } catch (err) {
    errEl.textContent = err.message || 'Sign up failed';
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
