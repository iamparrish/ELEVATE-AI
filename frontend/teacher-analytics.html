<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Analytics — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-root"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="app-main">
    <header class="app-topbar" id="topbar-root"></header>
    <div class="app-content" id="page-content">
      <h2>Class Analytics</h2>
      <div class="skeleton" style="height:300px;margin-top:16px"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireRole('teacher');
initShell('teacher-analytics');

async function loadClassAnalytics() {
  const content = document.getElementById('page-content');
  try {
    const data = await Api.get('/api/teacher/analytics');
    content.innerHTML = `
      <h2>Class Analytics</h2>
      <p class="text-muted" style="margin-bottom:20px">Aggregated from every student's real quiz and assessment data.</p>
      <div class="card card-pad" style="margin-bottom:20px">
        <h3>Topic-wise Class Performance</h3>
        ${data.topic_performance.length ? data.topic_performance.map(t => `
          <div style="margin-bottom:10px">
            <div class="flex justify-between text-sm" style="margin-bottom:4px"><span>${t.topic}</span><span class="font-bold">${t.average_mastery}% avg (${t.students_attempted} student(s))</span></div>
            <div class="progress-track"><div class="progress-fill ${t.average_mastery < 50 ? 'warning' : 'success'}" style="width:${t.average_mastery}%"></div></div>
          </div>`).join('') : `<p class="text-muted text-sm">No topic data yet.</p>`}
      </div>
      <div class="card card-pad">
        <h3>Frequently Misunderstood Concepts</h3>
        ${data.frequently_misunderstood.length ? data.frequently_misunderstood.map(t => `<div class="topic-result-row"><span>${t.topic}</span><span class="badge badge-warning">${t.average_mastery}%</span></div>`).join('') : `<p class="text-muted text-sm">Nothing concerning detected right now.</p>`}
      </div>
    `;
  } catch (e) {
    content.innerHTML = `<h2>Class Analytics</h2><div class="empty-state">${Icons.empty}<p>${e.message}</p></div>`;
  }
}
loadClassAnalytics();
</script>
</body>
</html>
