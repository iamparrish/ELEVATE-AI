<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-root"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="app-main">
    <header class="app-topbar" id="topbar-root"></header>
    <div class="app-content" id="page-content">
      <h2>Teacher Dashboard</h2>
      <div class="skeleton" style="height:300px;margin-top:16px"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireRole('teacher');
initShell('teacher-dashboard');

async function loadTeacherDashboard() {
  const content = document.getElementById('page-content');
  const user = Auth.getUser();
  let analytics, students;
  try {
    [analytics, students] = await Promise.all([Api.get('/api/teacher/analytics'), Api.get('/api/teacher/students')]);
  } catch (e) {
    content.innerHTML = `<h2>Teacher Dashboard</h2><div class="empty-state">${Icons.empty}<p>${e.message}</p></div>`;
    return;
  }

  content.innerHTML = `
    <h2>Welcome, ${user.full_name.split(' ')[0]} 👋</h2>
    <p class="text-muted" style="margin-bottom:20px">Class-wide insight, calculated from real student activity.</p>

    <div class="stat-grid" style="margin-bottom:24px">
      <div class="card stat-card"><div class="stat-label">Total Students</div><div class="stat-value">${analytics.total_students}</div></div>
      <div class="card stat-card"><div class="stat-label">Average Class Mastery</div><div class="stat-value">${analytics.average_mastery}%</div></div>
      <div class="card stat-card"><div class="stat-label">Need Support</div><div class="stat-value">${analytics.students_needing_support}</div></div>
      <div class="card stat-card"><div class="stat-label">Topics Tracked</div><div class="stat-value">${analytics.topic_performance.length}</div></div>
    </div>

    <div class="two-col">
      <div class="card card-pad">
        <h3>Frequently Misunderstood Concepts</h3>
        ${analytics.frequently_misunderstood.length ? analytics.frequently_misunderstood.map(t => `
          <div class="topic-result-row"><span>${t.topic}</span><span class="badge badge-warning">${t.average_mastery}% avg</span></div>`).join('') : `<p class="text-muted text-sm">No concerning topics detected right now.</p>`}
      </div>
      <div class="card card-pad">
        <h3>Students Needing Support</h3>
        ${students.students.filter(s => s.overall_mastery < 45).length ? students.students.filter(s => s.overall_mastery < 45).map(s => `
          <div class="topic-result-row"><span>${s.name}</span><span class="badge badge-danger">${s.overall_mastery}%</span></div>`).join('') : `<p class="text-muted text-sm">All students are tracking well.</p>`}
      </div>
    </div>
  `;
}
loadTeacherDashboard();
</script>
</body>
</html>
