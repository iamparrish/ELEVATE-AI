<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — ELEVATE AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .student-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--color-border); cursor: pointer; }
  .student-row:hover { background: #F7F7F6; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar-root"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main class="app-main">
    <header class="app-topbar" id="topbar-root"></header>
    <div class="app-content" id="page-content">
      <h2>Students</h2>
      <div class="skeleton" style="height:300px;margin-top:16px"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireRole('teacher');
initShell('teacher-students');

const spUrl = new URLSearchParams(location.search);
const focusId = spUrl.get('student_id');

async function loadStudentsList() {
  const content = document.getElementById('page-content');
  try {
    const data = await Api.get('/api/teacher/students');
    if (!data.students.length) {
      content.innerHTML = `<h2>Students</h2><div class="empty-state">${Icons.empty}<p>No students yet.</p></div>`;
      return;
    }
    content.innerHTML = `
      <h2>Students</h2>
      <p class="text-muted" style="margin-bottom:16px">Inspect any student's real progress, activity and recommendations.</p>
      <div class="card" id="students-table"></div>
      <div id="student-detail" style="margin-top:20px"></div>
    `;
    document.getElementById('students-table').innerHTML = data.students.map(s => `
      <div class="student-row" onclick="loadStudentDetail(${s.id})">
        <div><strong>${s.name}</strong><div class="text-xs text-muted">${s.email} · ${s.academic_level || ''}</div></div>
        <div class="flex gap-16 items-center">
          <span class="badge ${s.overall_mastery >= 60 ? 'badge-success' : s.overall_mastery >= 40 ? 'badge-warning' : 'badge-danger'}">${s.overall_mastery}% mastery</span>
          <span class="badge badge-neutral">${s.active_gaps} gap(s)</span>
        </div>
      </div>`).join('');
    if (focusId) loadStudentDetail(parseInt(focusId));
  } catch (e) {
    content.innerHTML = `<h2>Students</h2><div class="empty-state">${Icons.empty}<p>${e.message}</p></div>`;
  }
}

async function loadStudentDetail(studentId) {
  const container = document.getElementById('student-detail');
  container.innerHTML = `<div class="skeleton" style="height:200px"></div>`;
  try {
    const d = await Api.get(`/api/teacher/students/${studentId}`);
    container.innerHTML = `
      <div class="card card-pad">
        <div class="flex justify-between items-center" style="margin-bottom:14px">
          <h3>${d.student.name}</h3>
          <span class="badge badge-primary">${d.overall_mastery}% overall mastery</span>
        </div>
        <div class="two-col">
          <div>
            <h4 style="font-size:14px">Topic Breakdown</h4>
            ${d.topic_breakdown.map(t => `<div class="topic-result-row"><span>${t.topic}</span>${statusBadge(t.status)}</div>`).join('')}
          </div>
          <div>
            <h4 style="font-size:14px">Weak Areas</h4>
            ${d.weak_areas.length ? d.weak_areas.map(w => `<div class="topic-result-row"><span>Topic #${w.topic_id}</span><span class="badge badge-warning">${w.mastery}%</span></div>`).join('') : `<p class="text-muted text-sm">No active weak areas.</p>`}
            <h4 style="font-size:14px;margin-top:16px">Recent Quizzes</h4>
            ${d.recent_quizzes.length ? d.recent_quizzes.map(q => `<div class="topic-result-row"><span>${new Date(q.date).toLocaleDateString()}</span><span class="badge badge-neutral">${q.accuracy}%</span></div>`).join('') : `<p class="text-muted text-sm">No quiz attempts yet.</p>`}
          </div>
        </div>
      </div>`;
  } catch (e) {
    container.innerHTML = `<p class="text-muted text-sm">Could not load student detail.</p>`;
  }
}

loadStudentsList();
</script>
</body>
</html>
